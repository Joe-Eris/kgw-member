<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KWGM Member App</title><link rel="stylesheet" href="style.css"></head><body><div id="loginView" class="login card"><h1>Member Portal</h1><form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn">Sign in</button><p id="loginStatus" class="muted"></p></form><hr><h3>New member?</h3><form id="registerForm"><div class="field"><label>Full name</label><input name="full_name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Password</label><input name="password" type="password" minlength="10" required></div><div class="field"><label>Department</label><select name="department_id" id="departmentSelect"><option value="">Choose</option></select></div><button class="btn secondary">Create account</button></form></div><div id="appView" class="app hidden"><aside class="side"><h2>KWGM</h2><div class="nav"><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="dues">Dues & Payments</button><button data-tab="pledges">Pledges</button><button data-tab="attendance">Attendance</button><button data-tab="events">Events</button><button data-tab="card">Membership Card</button><button data-tab="profile">Profile</button></div><button id="logoutBtn" class="btn secondary">Sign out</button></aside><main class="main"><div id="content"></div></main></div><script src="config.js"></script><script src="app.js"></script></body></html>
